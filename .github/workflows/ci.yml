name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - name: Install
        run: npm ci
      - name: Secret leak check
        run: npm run check:secrets
      - name: Deploy script checks
        run: npm run check:deploy
      - name: Prisma validate
        run: npm run prisma:validate
        env:
          DATABASE_URL: postgresql://takiia_ci:takiia_ci@127.0.0.1:5432/takiia_ci
      - name: Prisma generate
        run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://takiia_ci:takiia_ci@127.0.0.1:5432/takiia_ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3033
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3034
          DATABASE_URL: postgresql://takiia_ci:takiia_ci@127.0.0.1:5432/takiia_ci
          SESSION_SECRET: CHANGE_ME_CI_SESSION_SECRET_VALUE_32
          CSRF_SECRET: CHANGE_ME_CI_CSRF_SECRET_VALUE_32XXXX
          WEB_ORIGIN: http://127.0.0.1:3034
